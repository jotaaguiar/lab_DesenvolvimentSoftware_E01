# Publica o portfolio no GitHub Pages a cada push na branch main.
#
# Como funciona: o site e estatico e o repositorio inteiro e o site,
# entao o workflow so espelha a main na branch gh-pages, que e a branch
# que o GitHub Pages serve.
#
# Por que nao usar actions/deploy-pages: aquele fluxo depende da API
# "create a Pages site", e o GITHUB_TOKEN padrao nao tem permissao para
# isso. O deploy falhava com "Resource not accessible by integration".
# Publicar via branch gh-pages nao precisa de nenhuma permissao extra
# alem de contents: write.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Um deploy por vez; nao cancela um deploy ja em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Espelhar main na branch gh-pages
        run: git push origin HEAD:gh-pages --force

      - name: Resumo
        run: |
          echo "### Portfolio publicado :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
