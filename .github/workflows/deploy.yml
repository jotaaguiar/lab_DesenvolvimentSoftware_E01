# Publica o portfolio no GitHub Pages a cada push na branch main.
#
# Antes do primeiro deploy, no repositorio do GitHub:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
#
# O site e estatico (HTML/CSS/JS puro), entao nao ha etapa de build:
# o repositorio inteiro e publicado como esta.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; nao cancela um deploy ja em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
