<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato — {{name}}</title>
<meta name="description" content="Formulário de contato e canais diretos: e-mail, WhatsApp, LinkedIn e GitHub.">
<meta name="theme-color" content="#059669">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23059669'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<div id="site-header"></div>

<main>
  <section class="section first">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow" data-i18n="contactEyebrow"></span>
        <h2 data-i18n="contactTitle"></h2>
        <p data-i18n="contactSubtitle"></p>
      </div>

      <div class="contact-grid">
        <!-- Canais diretos (icones clicaveis) -->
        <div>
          <h3 class="subhead" style="margin-top:0" data-i18n="contactChannels"></h3>
          <div class="contact-channels" data-contact-channels></div>
        </div>

        <!-- Formulario com envio por e-mail -->
        <div class="contact-form-card reveal">
          <h3 data-i18n="contactFormTitle"></h3>

          <form id="contact-form" novalidate style="margin-top:22px">
            <div class="field">
              <label for="field-name">
                <span data-i18n="formName"></span> <span class="required">*</span>
              </label>
              <input type="text" id="field-name" name="name" autocomplete="name"
                     data-i18n-placeholder="formNamePlaceholder" required>
              <span class="field-error" id="error-name" role="alert"></span>
            </div>

            <div class="field">
              <label for="field-email">
                <span data-i18n="formEmail"></span> <span class="required">*</span>
              </label>
              <input type="email" id="field-email" name="email" autocomplete="email"
                     data-i18n-placeholder="formEmailPlaceholder" required>
              <span class="field-error" id="error-email" role="alert"></span>
            </div>

            <div class="field">
              <label for="field-message">
                <span data-i18n="formMessage"></span> <span class="required">*</span>
              </label>
              <textarea id="field-message" name="message" rows="6"
                        data-i18n-placeholder="formMessagePlaceholder" required></textarea>
              <span class="field-error" id="error-message" role="alert"></span>
            </div>

            <button type="submit" class="btn btn-primary" data-i18n="formSubmit"></button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            <p class="form-note" data-i18n="formNote"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
</body>
</html>
