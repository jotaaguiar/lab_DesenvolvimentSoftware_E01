<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#ffffff}.line{stroke:#e6ebe8;stroke-width:1.5;fill:none}
      .box{fill:#f0f3f1;stroke:#dde4e0;stroke-width:1.5}
      .accent{fill:#059669}.accent-soft{fill:#ecfdf5;stroke:#a7f3d0;stroke-width:1.5}
      .txt{fill:#5c6b64;font-size:13px}.txt-s{fill:#8b9a93;font-size:11px}
      .title{fill:#0f1b16;font-weight:700}.ph{fill:#dde4e0}
      .label{fill:#059669;font-size:11px;font-weight:700;letter-spacing:1.2px}
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text x="40" y="34" class="title" font-size="15">WIREFRAME 03 — Experiências (experiencias.html)</text>
  <line x1="40" y1="46" x2="1160" y2="46" class="line"/>

  <!-- Header -->
  <rect x="40" y="70" width="1120" height="60" class="box" rx="8"/>
  <circle cx="70" cy="100" r="6" class="accent"/>
  <rect x="86" y="94" width="120" height="12" class="ph" rx="6"/>
  <rect x="560" y="92" width="72" height="16" class="ph" rx="8"/>
  <rect x="646" y="92" width="66" height="16" class="ph" rx="8"/>
  <rect x="726" y="92" width="86" height="16" class="accent-soft" rx="8"/>
  <rect x="826" y="92" width="66" height="16" class="ph" rx="8"/>
  <rect x="1010" y="88" width="62" height="24" class="ph" rx="12"/>
  <rect x="1082" y="88" width="24" height="24" class="ph" rx="12"/>

  <!-- Titulo -->
  <rect x="40" y="176" width="130" height="14" class="accent-soft" rx="7"/>
  <rect x="40" y="204" width="280" height="30" class="ph" rx="6"/>
  <rect x="40" y="248" width="660" height="12" class="ph" rx="6"/>

  <!-- Cards de experiencia: coluna esquerda = periodo/instituicao, direita = cargo/descricao -->
  <rect x="40" y="300" width="1120" height="130" class="box" rx="14"/>
  <rect x="70" y="326" width="110" height="20" class="accent-soft" rx="10"/>
  <text x="78" y="340" class="label">2024 — ATUAL</text>
  <rect x="70" y="360" width="150" height="18" class="ph" rx="5"/>
  <rect x="70" y="388" width="100" height="10" class="ph" rx="5"/>
  <rect x="310" y="328" width="220" height="14" class="accent-soft" rx="7"/>
  <rect x="310" y="360" width="800" height="10" class="ph" rx="5"/>
  <rect x="310" y="380" width="800" height="10" class="ph" rx="5"/>
  <rect x="310" y="400" width="540" height="10" class="ph" rx="5"/>
  <text x="70" y="292" class="txt-s">período · instituição · tipo</text>
  <text x="310" y="292" class="txt-s">cargo/atividade · descrição</text>

  <rect x="40" y="452" width="1120" height="130" class="box" rx="14"/>
  <rect x="70" y="478" width="110" height="20" class="accent-soft" rx="10"/>
  <text x="78" y="492" class="label">2025 — ATUAL</text>
  <rect x="70" y="512" width="130" height="18" class="ph" rx="5"/>
  <rect x="70" y="540" width="90" height="10" class="ph" rx="5"/>
  <rect x="310" y="480" width="200" height="14" class="accent-soft" rx="7"/>
  <rect x="310" y="512" width="800" height="10" class="ph" rx="5"/>
  <rect x="310" y="532" width="800" height="10" class="ph" rx="5"/>
  <rect x="310" y="552" width="600" height="10" class="ph" rx="5"/>

  <rect x="40" y="604" width="1120" height="80" class="box" rx="14" stroke-dasharray="6 6"/>
  <text x="600" y="650" text-anchor="middle" class="txt-s">novos itens entram automaticamente ao adicionar objetos ao array EXPERIENCES (data.js)</text>

  <!-- Rodape -->
  <rect x="40" y="706" width="1120" height="34" class="box" rx="8"/>
  <text x="70" y="728" class="txt-s">rodapé: crédito do laboratório + ícones sociais</text>
</svg>
